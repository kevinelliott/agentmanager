name: Pages

# Publishes the website in site/ to GitHub Pages, together with the installer,
# so `curl -fsSL https://kevinelliott.github.io/agentmanager/install.sh | sh`
# always serves the install.sh that is on main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp install.sh _site/install.sh
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
