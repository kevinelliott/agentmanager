# GoReleaser configuration for AgentManager
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  # CLI binary - pure Go (the SQLite driver is modernc.org/sqlite), so every
  # platform cross-compiles from one runner with CGO disabled.
  - id: agentmgr
    main: ./cmd/agentmgr
    binary: agentmgr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # Helper binary - Linux only (CGO required for systray)
  - id: agentmgr-helper-linux
    main: ./cmd/agentmgr-helper
    binary: agentmgr-helper
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # Helper binary - Windows. The tray library is pure Go on Windows, so this
  # cross-compiles without CGO. -H=windowsgui keeps a console window from
  # opening alongside the tray icon.
  - id: agentmgr-helper-windows
    main: ./cmd/agentmgr-helper
    binary: agentmgr-helper
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H=windowsgui
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # The macOS app needs AppKit, WebKit and a signing identity, so it is built
  # on a macOS runner by scripts/package-macos.sh (see the macos-app job in
  # .github/workflows/release.yml) and attached to the release as a DMG.

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    allow_different_binary_count: true
    files:
      - LICENSE*
      - README*
      - catalog.json

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: kevinelliott
    name: agentmanager
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## AgentManager v{{.Version}}

    ### Installation

    **Install script (macOS / Linux)**
    ```bash
    curl -fsSL https://kevinelliott.github.io/agentmanager/install.sh | sh
    ```

    **Homebrew (macOS / Linux)**
    ```bash
    brew install kevinelliott/tap/agentmanager
    ```

    **Download Binary**
    Download the appropriate binary for your platform from the assets below.

    **Go Install**
    ```bash
    go install github.com/kevinelliott/agentmanager/cmd/agentmgr@v{{.Version}}
    ```

brews:
  - name: agentmanager
    repository:
      owner: kevinelliott
      name: homebrew-tap
      # Fine-grained PAT with contents:write on kevinelliott/homebrew-tap,
      # stored as the HOMEBREW_TAP_TOKEN secret on this repository.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update agentmanager to {{ .Tag }}"
    directory: Formula
    homepage: "https://kevinelliott.github.io/agentmanager/"
    description: "CLI tool for managing AI development agents"
    license: "MIT"
    # Publish for stable tags only; prereleases (v1.6.0-rc.1) are skipped.
    skip_upload: auto
    test: |
      assert_match version.to_s, shell_output("#{bin}/agentmgr version")
    install: |
      bin.install "agentmgr"
      generate_completions_from_executable(bin/"agentmgr", "completion")

nfpms:
  - id: packages
    package_name: agentmanager
    vendor: Kevin Elliott
    homepage: https://github.com/kevinelliott/agentmanager
    maintainer: Kevin Elliott <kevin@kevinelliott.com>
    description: CLI tool for managing AI development agents
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: ./catalog.json
        dst: /usr/share/agentmgr/catalog.json
        type: config

announce:
  skip: true
